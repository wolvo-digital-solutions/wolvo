    <!-- Apply the saved day/night theme before first paint (no flash of the wrong theme). -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('wolvo_theme') === 'light') theme = 'light';
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f7fb' : '#07090e');
      })();
    </script>
